<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quillfinite — Vintage Cafe Book Booth &amp; Reading Nook</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=Patrick+Hand&display=swap"
    rel="stylesheet"
  />
  <!-- Leaflet CSS for interactive Hinigaran map -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: "#fff8e9",
            linen: "#f7efe0",
            espresso: "#38281f",
            umber: "#5b4034",
            terracotta: "#c76e4b",
            sage: "#71856a"
          },
          fontFamily: {
            display: ["Fraunces", "Georgia", "serif"],
            sans: ["Inter", "system-ui", "sans-serif"],
            hand: ["Patrick Hand", "cursive"]
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --bg-cream: #fff8e9;
      --ink-espresso: #38281f;
      --accent-terracotta: #c76e4b;
      --accent-sage: #71856a;
    }

    body {
      font-family: "Patrick Hand", cursive !important;
      background-color: #fff8e9;
      background-image:
        radial-gradient(ellipse at 12% 18%, rgba(191, 145, 91, 0.10) 0 1px, transparent 2px),
        radial-gradient(ellipse at 78% 62%, rgba(191, 145, 91, 0.10) 0 1px, transparent 2px),
        repeating-linear-gradient(0deg, transparent 0 31px, rgba(177, 143, 105, 0.055) 32px 33px);
      background-size: 29px 29px, 37px 37px, 100% 33px;
      color: #38281f;
      font-size: 17px;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, .font-display {
      font-family: "Fraunces", Georgia, serif;
    }

    h1, h2, h3 {
      text-decoration: underline;
      text-decoration-color: rgba(199, 110, 75, 0.34);
      text-decoration-thickness: 2px;
      text-underline-offset: 6px;
    }

    .sketch-box,
    .sketch-pill,
    .sketch-btn,
    section .rounded-2xl,
    main .rounded-xl,
    main .rounded-2xl {
      border: 2px solid #49372b !important;
      border-radius: 23px 17px 25px 19px / 18px 25px 17px 23px !important;
      box-shadow: 2px 3px 0 rgba(56, 40, 31, 0.16), 0 0 0 1px rgba(56, 40, 31, 0.06);
    }

    .sketch-btn {
      transition: transform 0.16s ease, box-shadow 0.16s ease;
      font-family: "Patrick Hand", cursive !important;
      font-size: 15px !important;
    }

    .sketch-btn:hover {
      transform: translate(-1px, -2px);
      box-shadow: 3px 5px 0 rgba(56, 40, 31, 0.25) !important;
    }

    button {
      cursor
