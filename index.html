<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Name &amp; 4-Digit PIN Access</title>
  <style>
    :root {
      --bg-paper: #f6f0e4;
      --bg-card: #fffdf8;
      --ink-primary: #2b2118;
      --ink-muted: #6e5d4f;
      --accent: #7c3f26;
      --accent-hover: #62301b;
      --border: #dfd3c0;
      --success-bg: #eef5ee;
      --success-ink: #27582b;
      --error-bg: #fbeceb;
      --error-ink: #8c231c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background-color: var(--bg-paper);
      color: var(--ink-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px 28px;
      box-shadow: 0 12px 30px rgba(43, 33, 24, 0.08);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    p.subtitle {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.9rem;
      color: var(--ink-muted);
      margin-bottom: 24px;
      line-height: 1.45;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--ink-primary);
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      font-size: 1rem;
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--ink-primary);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="password"] {
      letter-spacing: 0.35em;
      font-weight: 600;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124, 63, 38, 0.14);
    }

    .hint {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.78rem;
      color: var(--ink-muted);
      margin-top: 5px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    button {
      flex: 1;
      padding: 12px 16px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.15s ease;
      position: relative;
      z-index: 1;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button[type="button"] {
      background: transparent;
      color: var(--ink-primary);
      border: 1px solid var(--border);
      flex: 0 0 auto;
    }

    button[type="button"]:hover {
      background: #efe7d8;
    }

    .status {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 8px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.88rem;
      line-height: 1.45;
      display: none;
    }

    .status.success {
      display: block;
      background: var(--success-bg);
      color: var(--success-ink);
      border: 1px solid #c3dec4;
    }

    .status.error {
      display: block;
      background: var(--error-bg);
      color: var(--error-ink);
      border: 1px solid #f0c2be;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Enter Name &amp; PIN</h1>
    <p class="subtitle">Provide your name and a 4-digit PIN to continue.</p>

    <form id="pinForm" action="javascript:void(0);" novalidate>
      <div class="field">
        <label for="userName">Name</label>
        <input
          id="userName"
          name="userName"
          type="text"
          placeholder="Enter your name"
          autocomplete="name"
          required
        />
      </div>

      <div class="field">
        <label for="userPin">4-Digit PIN</label>
        <input
          id="userPin"
          name="userPin"
          type="password"
          inputmode="numeric"
          pattern="\d{4}"
          maxlength="4"
          placeholder="••••"
          autocomplete="off"
          required
        />
        <div class="hint">Numbers only, 4 digits (e.g., 1234).</div>
      </div>

      <div class="actions">
        <button id="submitBtn" type="submit">Submit</button>
        <button id="clearBtn" type="button">Clear</button>
      </div>
    </form>

    <div id="statusBox" class="status" role="status" aria-live="polite"></div>
  </main>

  <script>
    (function () {
      /**
       * Validates and processes a name and 4-digit PIN.
       * @param {string} name
       * @param {string} pin
       * @returns {{ ok: boolean, message: string, data?: { name: string, pin: string } }}
       */
      function submitNameAndPin(name, pin) {
        const cleanName = String(name || "").trim();
        const cleanPin = String(pin || "").trim();

        if (!cleanName) {
          return { ok: false, message: "Please enter your name." };
        }

        if (!/^\d{4}$/.test(cleanPin)) {
          return { ok: false, message: "PIN must be exactly 4 digits (0–9)." };
        }

        return {
          ok: true,
          message: `Saved entry for ${cleanName} (PIN verified format).`,
          data: { name: cleanName, pin: cleanPin }
        };
      }

      function initPinForm() {
        const form = document.getElementById("pinForm");
        const nameInput = document.getElementById("userName");
        const pinInput = document.getElementById("userPin");
        const submitBtn = document.getElementById("submitBtn");
        const clearBtn = document.getElementById("clearBtn");
        const statusBox = document.getElementById("statusBox");

        if (!form || !nameInput || !pinInput || !statusBox) return;

        function showStatus(result) {
          statusBox.textContent = result.message;
          statusBox.className = "status " + (result.ok ? "success" : "error");
        }

        function handleSubmission(event) {
          if (event && typeof event.preventDefault === "function") {
            event.preventDefault();
          }
          const result = submitNameAndPin(nameInput.value, pinInput.value);
          showStatus(result);
        }

        pinInput.addEventListener("input", function () {
          pinInput.value = pinInput.value.replace(/\D/g, "").slice(0, 4);
        });

        form.addEventListener("submit", handleSubmission);

        if (submitBtn) {
          submitBtn.addEventListener("click", function (event) {
            if (form.tagName !== "FORM") {
              handleSubmission(event);
            }
          });
        }

        if (clearBtn) {
          clearBtn.addEventListener("click", function () {
            nameInput.value = "";
            pinInput.value = "";
            statusBox.textContent = "";
            statusBox.className = "status";
            nameInput.focus();
          });
        }

        window.submitNameAndPin = submitNameAndPin;
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initPinForm);
      } else {
        initPinForm();
      }
    })();
  </script>
</body>
</html>
